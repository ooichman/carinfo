apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webapp
  name: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: webapp
    spec:
      containers:
      - image: quay.io/ooichman/carinfo/webapp:latest
        name: carinfo-webapp
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        env:
        - name: DBAPI_URL
          value: 'http://dbapi:8080'
        - name: PORT
          value: "8080"
        - name: USE_TLS
          value: "true"
        - name: TLS_PORT
          value: "8443"
        - name: TLS_CERT_FILE
          value: /etc/tls/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/tls/tls.key
        - name: HTML_DIR
          value: /opt/app-root/html
        volumeMounts:
        - name: tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: webapp-tls
          optional: true
