{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} · {{end}}CarInfo</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
{{end}}

{{define "brand"}}
<header class="hero">
  <p class="eyebrow">Inventory live from dbapi</p>
  <a class="brand" href="/">CarInfo</a>
  <p class="tagline">Red · black · white · track every chassis</p>
</header>
{{end}}

{{define "flash"}}
{{if .Error}}
<div class="banner error" role="alert">{{.Error}}</div>
{{end}}
{{end}}
