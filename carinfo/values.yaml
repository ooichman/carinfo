# Default values for carinfo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: quay.io/ooichman/carinfo
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Per-component image names under quay.io/ooichman/carinfo/
images:
  frontend: quay.io/ooichman/carinfo/frontend:latest
  appApi: quay.io/ooichman/carinfo/app-api:latest
  dbapi: quay.io/ooichman/carinfo/dbapi:latest
  webapp: quay.io/ooichman/carinfo/webapp:latest
  mariadb: mariadb:latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  dbapi:
    create: true
    automount: true
    annotations: {}
    name: ""
  app-api:
    create: true
    automount: true
    annotations: {}
    name: ""
  mariadb:
    create: true
    automount: true
    annotations: {}
    name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  mariadb:
    type: ClusterIP
    port: 3306
  dbapi:
    type: ClusterIP
    port: 8080
  app-api:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  app-api-ssl:
    type: ClusterIP 
    port: 8443
    targetPort: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
